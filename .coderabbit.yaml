language: en-GB
reviews:
  profile: assertive
  high_level_summary: true
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: [main]
  path_instructions:
    - path: '**/src/**'
      instructions: 'Review authentication, CSRF and WebSocket origin validation, session expiry, database correctness, and stale-save conflicts. Flag bugs and propose actionable fixes.'
    - path: '**/test/**'
      instructions: 'Check that assertions demonstrate failure behavior, real bidirectional WebSockets and database persistence rather than only mocks.'
